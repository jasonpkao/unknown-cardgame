<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>餘燼安可 拉密版</title>
<style>
:root{--bg:#120e1a;--panel:#1e1730;--line:#3a2f52;--text:#eee6ff;--dim:#9a8fb5;--red:#ff4d6d;--gold:#ffc857;--green:#7dffa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;font-size:14px}
#app{max-width:1000px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:4px 0 6px}h1 small{color:var(--dim);font-weight:400;font-size:13px}
a{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dim{color:var(--dim)}
canvas{width:100%;display:block;background:#0b0811;border:1px solid var(--line);border-radius:10px}
.btn{background:var(--gold);color:#000;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:#2a2140;color:var(--text);border:1px solid var(--line)}
.card{width:120px;min-height:104px;padding:8px;border-radius:10px;background:#2a2140;border:2px solid var(--line);cursor:pointer;font-size:12px;user-select:none;transition:transform .15s cubic-bezier(.3,1.6,.5,1);animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.card:hover{transform:translateY(-8px) scale(1.06);border-color:var(--gold)}
.card.pick{border-color:var(--red)}
.card b{font-size:15px;display:block;margin:4px 0}.card .t{font-size:11px;color:var(--dim)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.k{display:inline-block;min-width:20px;padding:1px 4px;margin:1px;border-radius:4px;font-weight:800;text-align:center;color:#000;font-size:12px}
.kW{background:#7fd3ff}.kA{background:#ffc857}.kS{background:#ff7b54}.kD{background:#b48cff}.kE{background:#ff3b3b;color:#fff}.kQ{background:#5ee0e0}
.skill{padding:5px 8px;border-radius:8px;background:#191326;border:1px solid var(--line);font-size:12px;min-width:150px;flex:1}
.skill.ok{border-color:var(--green)}.skill.live{border-color:var(--gold);box-shadow:0 0 8px #ffc85788}.skill.lock{opacity:.35}
.k.done{outline:2px solid #fff}
.overlay{position:fixed;inset:0;background:rgba(10,6,16,.88);display:flex;align-items:center;justify-content:center;z-index:9}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:760px;width:calc(100% - 32px);max-height:90vh;overflow:auto}
#log{font-size:12px;color:var(--dim);height:54px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div class="row" style="align-items:flex-start;justify-content:space-between">
    <div style="flex:1;min-width:260px">
      <h1>《Encore of Embers｜餘燼安可》 <small>拉密版戰鬥原型・<a href="v04.html">切到 v0.4 節拍版</a></small></h1>
      <div class="dim" style="font-size:13px;line-height:1.6">怪物出招時，場上會一波波落下字母牌。在一首戰鬥曲（60 秒）結束前，用鍵盤打出技能表上的指令：每打一個字母，先從場上扣，場上沒有才用自己的字母池。拼成就發動。音樂結束時場上剩幾張字母，你就受幾點傷害。<b>格擋 AWSA</b> 會清掉最早的一波，怪物還會送你 2 個字母。不用踩拍，盡量拼就好。</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn ghost" id="pauseBtn" onclick="togglePause()">⏸ 暫停（P）</button>
      <button class="btn ghost" onclick="restart()">↻ 重新開始</button>
    </div>
  </div>
  <div style="margin-top:8px"><canvas id="cv" width="960" height="400"></canvas></div>
  <div id="ui" style="margin-top:8px"></div>
  <div class="panel" style="margin-top:8px"><div class="dim" style="font-size:12px;margin-bottom:4px">技能表（要完全照順序打出；綠框＝場上加字母池湊得出）</div><div class="row" id="skills"></div></div>
  <div class="panel" style="margin-top:8px"><div id="log"></div></div>
</div>
<div id="ov"></div>
<script>
// ===== 資料 =====
const LET=['W','A','S','D','E','Q'];
const LCOL={W:'#7fd3ff',A:'#ffc857',S:'#ff7b54',D:'#b48cff',E:'#ff3b3b',Q:'#5ee0e0'};
const WHO={主角:{icon:'🎸',col:'#c39bff'},葛倫:{icon:'🥁',col:'#ff7b54'},莉瑟拉:{icon:'🪕',col:'#7fd3ff'},原始:{icon:'✊',col:'#cccccc'}};
const SKILLS=[
  {name:'格擋',who:'原始',cmd:'AWSA',text:'清掉最早一波攻擊，怪物送你 2 個 W/S',fx:guard},
  {name:'輕擊',who:'原始',cmd:'SWS',text:'4 傷害',fx:m=>dmg(4*m)},
  {name:'重拍',who:'葛倫',cmd:'WWAS',text:'10 傷害',fx:m=>dmg(10*m)},
  {name:'星光護幕',who:'莉瑟拉',cmd:'DAD',text:'護盾 6（擋時間到的傷害）',fx:m=>shield(6*m)},
  {name:'星露長音',who:'莉瑟拉',cmd:'DSDW',text:'8 傷害，下回合開始再 8',fx:m=>{dmg(8*m);G.dot+=8*m}},
  {name:'火星連打',who:'葛倫',cmd:'SDSD',locked:true,text:'8 傷害，燒掉場上所有 E',fx:m=>{dmg(8*m);clearField('E')}},
  {name:'熔爐重擊',who:'葛倫',cmd:'SSAWDD',locked:true,text:'24 傷害＋暈眩（下回合字母減半）',fx:m=>{dmg(24*m);G.stunNext=true;boom()}},
  {name:'異界之歌',who:'主角',cmd:'WAWED',locked:true,text:'22 傷害，清掉場上所有 Q',fx:m=>{dmg(22*m);clearField('Q');boom()}},
  {name:'裂縫和弦',who:'主角',cmd:'WDDAS',locked:true,text:'30 傷害，場上剩下的字母全收進字母池',fx:m=>{dmg(30*m);absorbField();boom()}},
];
// 單字母卡
const CARDS={
  W:{type:'key',l:'W',who:'主角'},A:{type:'key',l:'A',who:'主角'},E:{type:'key',l:'E',who:'主角'},
  S:{type:'key',l:'S',who:'葛倫'},D:{type:'key',l:'D',who:'莉瑟拉'},
};
const START_DECK=['W','W','W','W','A','A','A','S','S','S','D','D','D'];
const REWARD_CARDS=['W','A','S','D','E'];
// 波次：[秒, 張數, 特殊字母組數]
const every=(step,n,sp=0,from=0)=>{const w=[];for(let t=from;t<55;t+=step)w.push([t,n,sp]);return w;};
const ENEMIES=[
  {name:'噪音史萊姆',icon:'🦠',hp:90,hint:'教學：每 10 秒一大波',waves:r=>every(10,6)},
  {name:'尖嘯蝙蝠群',icon:'🦇',hp:100,hint:'三連擊：每 5 秒一小波',waves:r=>every(5,3)},
  {name:'石像守衛',icon:'🗿',hp:130,hint:'蓄力回合字母少，下回合一次倒一大把',waves:r=>r%2?every(15,3):[...every(12,4),[30,12]]},
  {name:'走音女妖',icon:'👻',hp:170,boss:true,hint:'Boss：混入 E（灼燒）和 Q（冰凍，每張 2 傷害）',waves:r=>every(8,5,1)},
];
const TIME=60,KEEP=3;

// ===== 狀態 =====
let G={},AC=null,uid=0;
const mk=id=>({id,uid:++uid});
function newRun(){
  G={deck:START_DECK.map(mk),skills:SKILLS.filter(s=>!s.locked).map(s=>s.cmd),morale:40,maxMorale:40,fight:0,phase:'map',floats:[],parts:[],field:[],history:[]};
  showIntro();
}
function startFight(){
  const E=ENEMIES[G.fight];G.enemy={...E,maxHp:E.hp,flash:0,knock:0,shownHp:E.hp};
  G.draw=shuffle(G.deck.slice());G.discard=[];G.hand=[];G.round=0;G.dot=0;G.burn=0;G.freeze=0;G.stunNext=false;
  G.pool={W:0,A:0,S:0,D:0,E:0,Q:0};
  log(`⚔ ${E.name} 出現！${E.hint}`);nextRound();
}
function nextRound(){
  G.round++;G.phase='plan';G.mode=null;G.shield=0;G.field=[];G.buf=[];
  if(G.burn){hurt(G.burn,'灼燒');G.burn=0;if(G.morale<=0)return lose();}
  if(G.dot){dmg(G.dot,'星露餘音');G.dot=0;if(G.enemy.hp<=0)return win();}
  const stun=G.stunNext;G.stunNext=false;
  G.waves=G.enemy.waves(G.round).map(([at,n,sp])=>({at,n:stun?Math.ceil(n/2):n,sp:sp||0,arrived:false}));
  G.time=TIME;G.casts=0;G.spawned=0;
  for(let i=0;i<5;i++)drawCard();
  render();
}
function drawCard(){if(!G.draw.length){if(!G.discard.length)return;G.draw=shuffle(G.discard);G.discard=[];}G.hand.push(G.draw.pop());}

// ===== 準備階段 =====
function playCard(i){
  if(G.phase!=='plan')return;const c=G.hand[i],C=CARDS[c.id];G.hand.splice(i,1);sfx('card');
  if(G.mode){if(G.mode==='swap'){G.discard.push(c);drawCard();}else{G.deck=G.deck.filter(d=>d.uid!==c.uid);log(`🚫 BAN：${cname(c.id)} 永久移出（牌組 ${G.deck.length} 張）`);}G.mode=null;return render();}
  G.discard.push(c);
  if(C.type==='key')for(const ch of C.l)G.pool[ch]++;
  else if(c.id==='tune'){drawCard();drawCard();}
  else if(G.hand.length)G.mode=c.id;
  render();
}
const cname=id=>CARDS[id].name||lettersText(CARDS[id].l);
function lettersText(s){const n={};for(const c of s)n[c]=(n[c]||0)+1;return Object.entries(n).map(([k,v])=>`${v}${k}`).join(' ');}

// ===== 交鋒階段 =====
function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended'&&!G.paused)AC.resume();return AC;}
const now=()=>AC.currentTime-G.t0;
function startClash(){
  if(G.phase!=='plan')return;audio();G.mode=null;G.phase='clash';G.t0=AC.currentTime+1.2;
  startMusic(G.t0);render();requestAnimationFrame(loop);
}
function playAll(){if(G.phase!=='plan')return;G.hand.forEach(c=>{G.pool[CARDS[c.id].l]++;G.discard.push(c);});G.hand=[];sfx('card');render();}
function loop(){
  if(G.phase!=='clash')return;
  if(!G.paused){
    const t=now();
    G.waves.forEach((w,i)=>{if(!w.arrived&&t>=w.at){w.arrived=true;spawnWave(w,i);}});
    if(t>=G.time)return timeUp();
  }
  draw();requestAnimationFrame(loop);
}
function spawnWave(w,i){
  const L=[];for(let k=0;k<w.n;k++)L.push('WASD'[rint(4)]);
  for(let k=0;k<w.sp;k++){L[rint(L.length)]='E';L[rint(L.length)]='Q';}
  L.forEach((ch,k)=>G.field.push({ch,wave:i,uid:++uid,born:performance.now()+k*60}));G.spawned+=L.length;
  thud(.5);shake(4);floatTxt(`第 ${i+1} 波：${w.n} 張字母`,'#ff9bb0',true);renderSkills();renderUI();
}
const bufStr=()=>G.buf.map(b=>b.ch).join('');
const mySkills=()=>SKILLS.filter(s=>G.skills.includes(s.cmd));
function typeLetter(ch){
  if(G.phase!=='clash'||G.paused||now()<0)return;
  const str=bufStr()+ch;
  if(!mySkills().some(s=>s.cmd.startsWith(str))){sfx('err');floatTxt(`沒有「${str}」開頭的招`,'#ff4d6d');return;}
  let src;const fi=G.field.findIndex(f=>f.ch===ch&&!f.gone);
  if(fi>=0){src={ch,from:'field',tile:G.field[fi]};G.field[fi].gone=performance.now();}
  else if(G.pool[ch]>0){G.pool[ch]--;src={ch,from:'pool'};}
  else{sfx('err');floatTxt(`沒有 ${ch} 了`,'#ff4d6d');return;}
  G.buf.push(src);keySound(ch);
  const s=mySkills().find(s=>s.cmd===bufStr());
  if(s)cast(s);
  renderSkills();renderUI();
}
function undo(){
  if(G.phase!=='clash'||!G.buf.length)return;const b=G.buf.pop();
  if(b.from==='field')b.tile.gone=0;else G.pool[b.ch]++;
  sfx('card');renderSkills();renderUI();
}
function cast(s){
  const fromField=G.buf.filter(b=>b.from==='field').length;G.casts++;
  G.field=G.field.filter(f=>!f.gone||performance.now()-f.gone<400);
  G.buf=[];phrase(s);sparks(WHO[s.who].col,s.cmd.length*8);if(s.cmd.length>=5)shake(12);
  floatTxt(s.name,WHO[s.who].col,true);
  log(`${WHO[s.who].icon} ${s.name} ${s.cmd}（用了場上字母 ${fromField} 張）`);
  s.fx(1);
  if(G.enemy.hp<=0){G.phase='won';record(now());stopMusic();setTimeout(win,500);}
}
function guard(){
  const live=G.field.filter(f=>!f.gone);
  if(!live.length){floatTxt('格擋落空：場上沒有字母','#9a8fb5',true);return;}
  const w=Math.min(...live.map(f=>f.wave));let n=0;live.forEach(f=>{if(f.wave===w){f.gone=performance.now();n++;}});
  const gift=[0,1].map(()=>'WS'[rint(2)]);gift.forEach(c=>G.pool[c]++);
  clang();floatTxt(`擋下第 ${w+1} 波（${n} 張）！獲得 ${gift.join(' ')}`,'#ffc857',true);
}
function clearField(ch){G.field.forEach(f=>{if(f.ch===ch&&!f.gone)f.gone=performance.now();});}
function absorbField(){G.field.forEach(f=>{if(!f.gone){f.gone=performance.now();G.pool[f.ch]++;}});}
// 測試用：記錄每回合拼出幾組，用來回頭調整字母量
function record(t){
  const secs=Math.max(1,Math.min(G.time,t));G.history.push({casts:G.casts,secs,spawned:G.spawned});
  const tot=G.history.reduce((a,h)=>({c:a.c+h.casts,s:a.s+h.secs}),{c:0,s:0});
  log(`📊 本回合 ${secs.toFixed(0)} 秒拼出 ${G.casts} 組（場上共落下 ${G.spawned} 張）｜累計平均每 60 秒 ${(tot.c/tot.s*60).toFixed(1)} 組`);
}
function timeUp(){
  G.phase='end';record(now());stopMusic();
  // 拼到一半的指令：場上的字母放回去，字母池的字母浪費
  G.buf.forEach(b=>{if(b.from==='field')b.tile.gone=0;});if(G.buf.length)log(`拼到一半的「${bufStr()}」沒發動`);G.buf=[];
  const left=G.field.filter(f=>!f.gone);
  const e=left.filter(f=>f.ch==='E').length,q=left.filter(f=>f.ch==='Q').length;
  let d=left.length+q;const ab=Math.min(G.shield,d);d-=ab;
  if(left.length){hurt(d,`剩 ${left.length} 張字母${q?`，Q 冰凍 +${q}`:''}${ab?`，護盾擋 ${ab}`:''}`);shake(10);thud(1);}else floatTxt('場上清空！無傷','#7dffa8',true);
  if(e){G.burn=2*e;log(`🔥 ${e} 個 E 沒消掉：下回合灼燒 ${G.burn}`);}
  // 字母池保留最多 KEEP 個
  let keep=KEEP;LET.forEach(k=>{const n=Math.min(G.pool[k],keep);keep-=n;G.pool[k]=n;});
  G.discard.push(...G.hand);G.hand=[];
  draw();render();
  if(G.morale<=0)return setTimeout(lose,600);
  setTimeout(nextRound,1200);
}
function finishEarly(){if(G.phase==='clash'&&G.waves.every(w=>w.arrived))timeUp();}
function dmg(n,why){n=Math.round(n);const E=G.enemy;E.hp=Math.max(0,E.hp-n);E.flash=performance.now();E.knock=Math.min(30,8+n);
  G.floats.push({x:760,y:90,text:`-${n}${why?' '+why:''}`,col:'#fff',born:performance.now(),big:true});}
function shield(n){G.shield+=Math.round(n);floatTxt(`護盾 +${Math.round(n)}`,'#7dffa8',true);}
function hurt(n,why){G.morale=Math.max(0,G.morale-n);floatTxt(`-${n} 士氣（${why}）`,'#ff4d6d',true);log(`💥 受到 ${n} 傷害（${why}）`);}
function win(){
  G.phase='won';G.morale=Math.min(G.maxMorale,G.morale+8);sfx('win');
  if(G.fight===ENEMIES.length-1)return overlay(`<h2>🎶 走音女妖安靜了</h2><p>第一段「歸途旋律」響起。Demo 結束，最後一場打了 ${G.round} 回合。</p><p><b>打完一場，想不想再打一場？</b></p><button class="btn" onclick="closeOv();newRun()">再來一輪</button>`);
  const locked=SKILLS.filter(s=>!G.skills.includes(s.cmd));
  const opts=shuffle(REWARD_CARDS.slice()).slice(0,locked.length?2:3).map(id=>({card:id}));
  if(locked.length)opts.push({skill:locked[rint(locked.length)].cmd});
  overlay(`<h2>勝利！${G.enemy.name} 被旋律驅散（${G.round} 回合）</h2><p class="dim">士氣 +8（${G.morale}/${G.maxMorale}）。選一個獎勵：</p>
  <div class="row">${opts.map(o=>o.card?cardHTML(o.card,`onclick="takeReward('c','${o.card}')"`):skillCard(o.skill)).join('')}</div><p><button class="btn ghost" onclick="takeReward()">跳過</button></p>`);
}
function skillCard(cmd){const s=SKILLS.find(x=>x.cmd===cmd);return `<div class="card" style="width:200px;border-top:4px solid ${WHO[s.who].col}" onclick="takeReward('s','${cmd}')"><div class="t">新技能・${WHO[s.who].icon} ${s.who}</div><b>${s.name}</b>${keysHTML(s.cmd)}<div style="margin-top:4px">${s.text}</div></div>`;}
function takeReward(type,v){if(type==='c'){G.deck.push(mk(v));log(`＋ ${cname(v)} 加入牌組`);}if(type==='s'){G.skills.push(v);log(`＋ 學會新技能 ${v}`);}G.fight++;closeOv();startFight();}
function lose(){G.phase='over';overlay(`<h2>士氣歸零</h2><p>樂團被 ${G.enemy.name} 擊潰了。</p><button class="btn" onclick="closeOv();newRun()">重新開始</button>`);}
function togglePause(){
  if(G.phase!=='clash'){log('只有交鋒階段可以暫停');return;}
  G.paused=!G.paused;G.paused?AC.suspend():AC.resume();
  document.getElementById('pauseBtn').textContent=G.paused?'▶ 繼續（P）':'⏸ 暫停（P）';draw();
}
function restart(){
  if(!confirm('確定要放棄這次冒險，從頭開始？'))return;
  G.phase='over';G.paused=false;stopMusic();if(AC)AC.resume();
  document.getElementById('pauseBtn').textContent='⏸ 暫停（P）';document.getElementById('log').innerHTML='';closeOv();newRun();
}
function showIntro(){
  overlay(`<h2>諧音界・拉密版戰鬥</h2>
  <ul class="dim"><li><b>準備</b>：每回合抽 5 張單字母卡，打出後放進你的字母池。</li>
  <li><b>交鋒</b>：戰鬥曲播放 ${TIME} 秒，怪物一波波把字母丟到場上。用鍵盤 W/A/S/D/E/Q 打出技能表上的指令，每個字母<b>先扣場上的</b>，場上沒有才用字母池。完整打出就發動。打錯可以按 Backspace 退回。不用踩拍。</li>
  <li>音樂結束＝時間到：場上剩下的字母每張 1 點傷害，Q 每張 2 點；沒消掉的 E 下回合灼燒。拼到一半的指令不發動。</li>
  <li><b>格擋 AWSA</b> 清掉最早的一波，怪物還會送你 2 個 W/S，接成更長的招。</li>
  <li>字母池最多保留 ${KEEP} 個到下回合。勝利後可以選新卡或學新技能。</li></ul>
  <p><button class="btn" onclick="closeOv();startFight()">出發 ▶</button></p>`);
}

// ===== UI =====
const keysHTML=s=>s.split('').map(k=>`<span class="k k${k}">${k}</span>`).join('');
function cardHTML(id,attr='',cls=''){const C=CARDS[id],w=WHO[C.who];
  const body=C.type==='key'?`<div style="font-size:44px;font-weight:900;color:${LCOL[C.l]};text-align:center;margin:6px 0">${C.l}</div><div class="t">字母牌</div>`:`<b>${C.name}</b><div class="t">整理牌</div><div style="margin-top:4px">${C.text}</div>`;
  return `<div class="card ${cls}" ${attr} style="border-top:4px solid ${w.col}"><div class="t">${w.icon} ${C.who}</div>${body}</div>`;}
function render(){renderUI();renderSkills();draw();}
// 大字母池：場上＋手上一眼看清
function poolHTML(){
  const f={};(G.field||[]).forEach(t=>{if(!t.gone)f[t.ch]=(f[t.ch]||0)+1;});
  return `<div class="row">${LET.filter(k=>'WASD'.includes(k)||G.pool[k]||f[k]).map(k=>{const n=(f[k]||0)+G.pool[k];
    return `<div style="flex:1;min-width:110px;text-align:center;padding:6px;border-radius:10px;background:#0b0811;border:2px solid ${n?LCOL[k]:'#3a2f52'};opacity:${n?1:.45}">
    <div style="font-size:40px;font-weight:900;line-height:1.1;color:${LCOL[k]}">${k}<span style="font-size:26px;color:#fff"> ×${n}</span></div>
    <div class="dim" style="font-size:12px">場上 ${f[k]||0}・字母池 ${G.pool[k]}</div></div>`}).join('')}</div>`;
}
function renderUI(){
  const el=document.getElementById('ui');if(!G.enemy){el.innerHTML='';return;}
  if(G.phase==='plan'){
    el.innerHTML=`<div class="panel"><div class="dim" style="font-size:12px;margin-bottom:4px">可用字母（場上＋字母池）</div>${poolHTML()}</div>
    <div class="row" style="align-items:center;margin-top:8px">
    <div class="panel dim">預告：${G.waves.length} 波，共 ${G.waves.reduce((s,w)=>s+w.n,0)} 張字母${G.waves.some(w=>w.sp)?'（含 E、Q）':''}　時限 ${G.time} 秒</div>
    <button class="btn ghost" onclick="playAll()">全部打出</button>
    <button class="btn" onclick="startClash()">開始交鋒（Enter）</button><span class="dim">牌庫 ${G.draw.length}｜棄牌 ${G.discard.length}｜牌組 ${G.deck.length}</span></div>
    ${G.mode?`<div style="color:var(--red);margin-top:6px">${G.mode==='swap'?'換弦：點一張手牌棄掉':'BAN：點一張手牌永久移除'}</div>`:''}
    <div class="row" style="margin-top:8px">${G.hand.map((c,i)=>cardHTML(c.id,`onclick="playCard(${i})"`,G.mode?'pick':'')).join('')||'<span class="dim">手牌打完了</span>'}</div>`;
  }else el.innerHTML=`<div class="panel"><div class="dim" style="font-size:12px;margin-bottom:4px">可用字母（場上＋字母池）・打字拼招・Backspace 退回・最後一波落下後按 Enter 提早結束</div>${poolHTML()}</div>`;
}
function avail(){const n={...G.pool};(G.field||[]).forEach(f=>{if(!f.gone)n[f.ch]=(n[f.ch]||0)+1;});return n;}
function renderSkills(){
  const str=G.phase==='clash'?bufStr():'',n=avail();
  document.getElementById('skills').innerHTML=SKILLS.map(s=>{
    const have=G.skills&&G.skills.includes(s.cmd);
    const need={};for(const c of s.cmd.slice(str&&s.cmd.startsWith(str)?str.length:0))need[c]=(need[c]||0)+1;
    const ok=have&&Object.keys(need).every(c=>(n[c]||0)>=need[c]),live=have&&str&&s.cmd.startsWith(str);
    return `<div class="skill ${!have?'lock':live?'live':ok?'ok':''}"><b>${WHO[s.who].icon} ${s.name}</b> <span class="dim">${s.who}${have?'':'・未學會'}</span><br>${s.cmd.split('').map((k,i)=>`<span class="k k${k} ${live&&i<str.length?'done':''}">${k}</span>`).join('')}<br><span class="dim">${s.text}</span></div>`;}).join('');
}

// ===== 繪圖 =====
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
function floatTxt(text,col,big){G.floats.push({x:big?300:40,y:big?160:385,text,col,born:performance.now(),big});}
function sparks(col,n){for(let i=0;i<n;i++)G.parts.push({x:700+Math.random()*120,y:100+Math.random()*60,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*6,col,born:performance.now()});}
function shake(px){cv.style.transform=`translate(${(Math.random()-.5)*px}px,${(Math.random()-.5)*px}px)`;setTimeout(()=>cv.style.transform='',90);}
function draw(){
  const W=cv.width,H=cv.height,P=performance.now();cx.clearRect(0,0,W,H);if(!G.enemy)return;
  ['主角','葛倫','莉瑟拉'].forEach((w,i)=>{cx.font='40px system-ui';cx.fillText(WHO[w].icon,60+i*80,125+(i%2)*16);cx.font='12px system-ui';cx.fillStyle=WHO[w].col;cx.fillText(w,62+i*80,150+(i%2)*16);});
  cx.fillStyle='#fff';cx.font='bold 14px system-ui';cx.fillText(`士氣 ${G.morale}/${G.maxMorale}`,50,28);bar(50,36,240,10,G.morale/G.maxMorale,'#7dffa8');
  if(G.shield){cx.fillStyle='#7dffa8';cx.fillText(`🛡 ${G.shield}`,300,46);}
  cx.fillStyle='#9a8fb5';cx.font='13px system-ui';cx.fillText(`第 ${G.fight+1}/${ENEMIES.length} 場・回合 ${G.round}${G.burn?`・灼燒 ${G.burn}`:''}`,50,66);
  const E=G.enemy;E.shownHp+=(E.hp-E.shownHp)*.15;E.knock*=.88;
  cx.save();cx.font='88px system-ui';if(P-E.flash<120)cx.filter='brightness(4)';cx.fillText(E.icon,720+E.knock,150);cx.restore();
  cx.fillStyle='#fff';cx.font='bold 15px system-ui';cx.fillText(`${E.name}${E.boss?'（Boss）':''}`,640,28);
  bar(640,36+(Math.abs(E.shownHp-E.hp)>.5?Math.sin(P/30)*2:0),260,12,E.shownHp/E.maxHp,'#ff4d6d');cx.fillStyle='#fff';cx.font='12px system-ui';cx.fillText(`${E.hp}/${E.maxHp}`,905,47);
  // 時限條
  const t=G.phase==='clash'?now():G.phase==='plan'?-1:G.time;
  bar(50,180,860,8,G.phase==='clash'?Math.max(0,1-Math.max(0,t)/G.time):1,'#ffc857');
  if(G.phase==='clash'){cx.fillStyle=G.time-t<10?'#ff4d6d':'#ffc857';cx.font='bold 14px system-ui';cx.fillText(t<0?'準備…':`♪ ${Math.max(0,G.time-t).toFixed(0)} 秒`,912,189);
    G.waves.forEach((w,i)=>{const x=50+860*w.at/G.time;cx.fillStyle=w.arrived?'#ff4d6d55':'#ff4d6d';cx.fillRect(x-1,176,3,16);});}
  // 場上字母
  cx.fillStyle='#9a8fb5';cx.font='12px system-ui';cx.fillText('場上字母（時間到時每張 1 點傷害）',50,212);
  // 場上字母依落下順序排成格子，最早一波（格擋目標）加白框
  const live=G.field.filter(f=>!f.gone),oldest=live.length?Math.min(...live.map(f=>f.wave)):-1;
  G.field.forEach((f,i)=>{
    const x=50+(i%20)*43,y=222+Math.floor(i/20)*40,age=P-f.born;if(age<0||y>360)return;
    let a=1,dy=Math.max(0,1-age/200)*-30;if(f.gone){a=1-(P-f.gone)/300;if(a<=0)return;dy=-(1-a)*20;}
    cx.globalAlpha=a;cx.fillStyle=LCOL[f.ch];cx.fillRect(x,y+dy,38,34);
    if(f.wave===oldest&&!f.gone){cx.strokeStyle='#fff';cx.lineWidth=2;cx.strokeRect(x,y+dy,38,34);}
    cx.fillStyle=f.ch==='E'?'#fff':'#000';cx.font='bold 22px system-ui';cx.fillText(f.ch,x+11,y+dy+25);cx.globalAlpha=1;});
  cx.fillStyle='#ff9bb0';cx.font='13px system-ui';cx.fillText(`場上 ${live.length} 張`,850,212);
  if(G.phase==='plan'){cx.fillStyle='#665a80';cx.font='14px system-ui';cx.fillText('開始交鋒後，字母會在預告的時間點落下。',50,250);}
  // 輸入中
  if(G.phase==='clash'&&G.buf.length){cx.fillStyle='#fff';cx.font='bold 18px system-ui';cx.fillText('輸入：',560,212+0);G.buf.forEach((b,i)=>{cx.fillStyle=LCOL[b.ch];cx.fillText(b.ch,620+i*22,212);});}
  G.parts=G.parts.filter(p=>P-p.born<600);G.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;cx.globalAlpha=1-(P-p.born)/600;cx.fillStyle=p.col;cx.fillRect(p.x,p.y,4,4);});cx.globalAlpha=1;
  G.floats=G.floats.filter(f=>P-f.born<1100);G.floats.forEach(f=>{const a=(P-f.born)/1100;cx.globalAlpha=1-a;cx.fillStyle=f.col;cx.font=`bold ${f.big?22:13}px system-ui`;cx.fillText(f.text,f.x,f.y-a*24);});cx.globalAlpha=1;
  if(G.paused){cx.fillStyle='rgba(10,6,16,.8)';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='bold 36px system-ui';cx.textAlign='center';cx.fillText('已暫停',W/2,H/2);cx.textAlign='left';}
}
function bar(x,y,w,h,f,col){cx.fillStyle='#000';cx.fillRect(x,y,w,h);cx.fillStyle=col;cx.fillRect(x,y,w*Math.max(0,Math.min(1,f)),h);}
function idle(){if(G.phase!=='clash')draw();requestAnimationFrame(idle);}

// ===== 聲音 =====
function osc(type,f,t,d,v,f2){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}
// ===== 60 秒戰鬥曲：120 BPM × 30 小節，音樂結束＝時間到 =====
let MUS=null,NOISE=null;
function note(dest,type,f,t,d,v,f2){const a=AC,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);g.connect(dest);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}
function noise(dest,t,d,v,hp){if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(dest);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.start(t);s.stop(t+d);}
function startMusic(t0){
  stopMusic();const m=AC.createGain();m.gain.value=0.35;m.connect(AC.destination);MUS=m;
  const B=0.5,prog=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]]; // Am F C G
  const lead=[0,2,1,2,0,2,1,2];
  for(let bar=0;bar<30;bar++){
    const t=t0+bar*4*B,ch=prog[bar%4],hot=bar>=20,final=bar>=25;
    for(let b=0;b<4;b++){const tb=t+b*B;
      if(b%2===0)note(m,'sine',110,tb,0.25,0.9,40);           // 大鼓
      else noise(m,tb,0.15,0.35,1500);                          // 小鼓
      for(let e=0;e<(hot?4:2);e++)noise(m,tb+e*B/(hot?4:2),0.04,0.12,7000); // hi-hat
      for(let e=0;e<2;e++)note(m,'sawtooth',ch[0]/2,tb+e*B/2,0.22,0.18);    // 貝斯八分音
    }
    note(m,'triangle',ch[1],t,4*B,0.06);note(m,'triangle',ch[2],t,4*B,0.06); // 和弦墊底
    if(bar>=8)for(let e=0;e<8;e++)note(m,'square',ch[lead[e]]*(final?4:2),t+e*B/2,0.18,0.04); // 主旋律分散和弦
  }
  noise(m,t0+60,1.5,0.5,3000);note(m,'sine',55,t0+60,1.5,0.9,30); // 結尾重音
}
function stopMusic(){if(!MUS)return;const m=MUS;MUS=null;try{m.gain.setTargetAtTime(0,AC.currentTime,0.08);setTimeout(()=>m.disconnect(),600);}catch(e){}}
const KF={W:659,A:523,S:110,D:784,E:330,Q:988};
function keySound(k){const t=audio().currentTime;if(k==='S')osc('sine',160,t,0.18,0.5,45);else osc(k==='A'?'sawtooth':'triangle',KF[k],t,0.18,0.15);}
function phrase(s){const t=audio().currentTime,base={主角:392,葛倫:196,莉瑟拉:523,原始:330}[s.who];[0,4,7,12].slice(0,Math.min(4,s.cmd.length-1)).forEach((st,i)=>osc(s.who==='葛倫'?'sawtooth':'triangle',base*Math.pow(2,st/12),t+0.04+i*0.07,0.25,0.12));}
function boom(){const t=audio().currentTime;osc('sine',90,t,0.6,0.9,30);osc('sawtooth',60,t,0.4,0.3,25);}
function clang(){const t=audio().currentTime;osc('square',1400,t,0.25,0.15,900);osc('triangle',2100,t,0.3,0.12);}
function thud(v){const t=audio().currentTime;osc('sine',120,t,0.25,0.5*v,40);}
function sfx(n){const t=audio().currentTime;if(n==='card')osc('triangle',880,t,0.06,0.08,1200);if(n==='err')osc('sawtooth',140,t,0.12,0.1,90);if(n==='win')[0,4,7,12].forEach((s,i)=>osc('triangle',523*Math.pow(2,s/12),t+i*0.1,0.4,0.15));}

// ===== 雜項 =====
function rint(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function log(s){const el=document.getElementById('log');el.innerHTML=`<div>${s}</div>`+el.innerHTML;}
function overlay(h){document.getElementById('ov').innerHTML=`<div class="overlay"><div class="box">${h}</div></div>`;}
function closeOv(){document.getElementById('ov').innerHTML='';}
document.addEventListener('keydown',e=>{
  if(e.repeat||document.getElementById('ov').innerHTML)return;const k=e.key.toUpperCase();
  if(k==='P'){togglePause();return;}
  if(LET.includes(k)){typeLetter(k);e.preventDefault();}
  else if(e.key==='Backspace'){undo();e.preventDefault();}
  else if(e.key==='Enter'){if(G.phase==='plan')startClash();else finishEarly();}
});
newRun();idle();
</script>
</body>
