<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>餘燼安可 尻招版</title>
<style>
:root{--bg:#120e1a;--panel:#1e1730;--line:#3a2f52;--text:#eee6ff;--dim:#9a8fb5;--red:#ff4d6d;--gold:#ffc857;--green:#7dffa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,"PingFang TC","Noto Sans TC",sans-serif;font-size:14px}
#app{max-width:1000px;margin:0 auto;padding:12px 16px}
h1{font-size:20px;margin:4px 0 6px}h1 small{color:var(--dim);font-weight:400;font-size:13px}
a{color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dim{color:var(--dim)}
canvas{width:100%;display:block;background:#0b0811;border:1px solid var(--line);border-radius:10px}
.btn{background:var(--gold);color:#000;border:0;border-radius:8px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:#2a2140;color:var(--text);border:1px solid var(--line)}
.card{width:130px;min-height:110px;padding:8px;border-radius:10px;background:#2a2140;border:2px solid var(--line);cursor:pointer;font-size:12px;user-select:none;transition:transform .15s cubic-bezier(.3,1.6,.5,1);animation:pop .25s cubic-bezier(.3,1.6,.5,1)}
.card:hover{transform:translateY(-8px) scale(1.06);border-color:var(--gold)}
.card b{font-size:16px;display:block;margin:4px 0}.card .t{font-size:11px;color:var(--dim)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.k{display:inline-block;min-width:26px;padding:2px 5px;margin:1px;border-radius:5px;font-weight:900;text-align:center;color:#000;font-size:17px}
.kW{background:#7fd3ff}.kA{background:#ffc857}.kS{background:#ff7b54}.kD{background:#b48cff}.kE{background:#ff6b9a}.kQ{background:#5ee0e0}
.skill{padding:8px 10px;border-radius:10px;background:#191326;border:2px solid var(--line);font-size:12px;min-width:200px;flex:1}
.skill.live{border-color:var(--gold);box-shadow:0 0 10px #ffc85788}.skill.tired{opacity:.55}
.k.done{outline:3px solid #fff;opacity:.5}
.overlay{position:fixed;inset:0;background:rgba(10,6,16,.88);display:flex;align-items:center;justify-content:center;z-index:9}
.overlay .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:820px;width:calc(100% - 32px);max-height:90vh;overflow:auto}
#log{font-size:12px;color:var(--dim);height:54px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div class="row" style="align-items:flex-start;justify-content:space-between">
    <div style="flex:1;min-width:260px">
      <h1>《Encore of Embers｜餘燼安可》 <small>尻招版戰鬥原型・<a href="v04.html">切到 v0.4 節拍版</a></small></h1>
      <div class="dim" style="font-size:13px;line-height:1.6">樂團 7 人，每人一招。<b>準備</b>時打出時間卡：拉長時間，或縮短時間換傷害加成。<b>交鋒</b>時戰鬥曲一響就開始，在音樂結束前用鍵盤盡量把技能指令打出來，打完一組就發動。怪物攻擊前會預警，趕快打出<b>柯魯格</b>的格擋招擋下。連續用同一招傷害減半，要換著打。</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn ghost" id="pauseBtn" onclick="togglePause()">⏸ 暫停（P）</button>
      <button class="btn ghost" onclick="restart()">↻ 重新開始</button>
    </div>
  </div>
  <div style="margin-top:8px"><canvas id="cv" width="960" height="330"></canvas></div>
  <div id="ui" style="margin-top:8px"></div>
  <div class="panel" style="margin-top:8px"><div class="dim" style="font-size:12px;margin-bottom:4px">技能表（一人一招，打贏可以替換）</div><div class="row" id="skills"></div></div>
  <div class="panel" style="margin-top:8px"><div id="log"></div></div>
</div>
<div id="ov"></div>
<script>
// ===== 資料 =====
const LET=['W','A','S','D','E','Q'];
const LCOL={W:'#7fd3ff',A:'#ffc857',S:'#ff7b54',D:'#b48cff',E:'#ff6b9a',Q:'#5ee0e0'};
// 7 位角色，每人一個技能槽；同一角色的招式開頭相同，所以換招不會和別人撞指令
const CHARS=[
  {id:'me',name:'主角',icon:'🎸',col:'#c39bff',inst:'地球的吉他'},
  {id:'grun',name:'葛倫',icon:'🥁',col:'#ff7b54',inst:'熔爐鼓'},
  {id:'lis',name:'莉瑟拉',icon:'🪕',col:'#7fd3ff',inst:'星露琴'},
  {id:'kol',name:'柯魯格',icon:'🦴',col:'#e8d8b0',inst:'骨鳴貝斯'},
  {id:'pip',name:'皮皮',icon:'⚙️',col:'#9be36b',inst:'雜響機'},
  {id:'mar',name:'瑪琳',icon:'🐚',col:'#5ee0e0',inst:'潮聲琴'},
  {id:'oak',name:'歐克',icon:'🌳',col:'#c9a36b',inst:'年輪琴'},
];
const SKILLS={
  me:[
    {name:'異界刷奏',cmd:'WAS',text:'4 傷害',fx:m=>dmg(4*m)},
    {name:'回音連奏',cmd:'WAWAW',text:'11 傷害',fx:m=>dmg(11*m)},
    {name:'裂縫和弦',cmd:'WDDAS',text:'9 傷害，下一次攻擊延後 4 秒',fx:m=>{dmg(9*m);delayNext(4)}},
  ],
  grun:[
    {name:'熔爐重擊',cmd:'SSADD',text:'12 傷害',fx:m=>{dmg(12*m)}},
    {name:'火星',cmd:'SSA',text:'5 傷害',fx:m=>dmg(5*m)},
    {name:'熔爐爆裂',cmd:'SSADDW',text:'17 傷害＋震動',fx:m=>{dmg(17*m);boom();shake(14)}},
  ],
  lis:[
    {name:'星露長音',cmd:'DSDW',text:'6 傷害，3 秒後再 6',fx:m=>{dmg(6*m);setTimeout(()=>{if(G.phase==='clash')dmg(6*m,'餘音')},3000)}},
    {name:'星光護幕',cmd:'DAD',text:'護盾 6',fx:m=>shield(6*m)},
    {name:'流星',cmd:'DWDWD',text:'12 傷害',fx:m=>dmg(12*m)},
  ],
  kol:[
    {name:'骨鳴壁',cmd:'ADA',guard:'block',text:'格擋：2 秒內的攻擊全擋下',fx:()=>guard('block')},
    {name:'骨鳴彈反',cmd:'ADSDA',guard:'parry',text:'格擋：2 秒內的攻擊擋下並彈回 2 倍傷害',fx:()=>guard('parry')},
    {name:'低頻共鳴',cmd:'AWA',guard:'shield',text:'格擋：2 秒內的攻擊擋下，再得護盾 4',fx:()=>guard('shield')},
  ],
  pip:[
    {name:'取樣',cmd:'QWQ',text:'把上一招再發動一次（不受疲勞）',fx:m=>replay()},
    {name:'雜響',cmd:'QSQ',text:'隨機 2～14 傷害',fx:m=>dmg((2+rint(13))*m)},
    {name:'廢鐵亂打',cmd:'QAQAQ',text:'10 傷害',fx:m=>dmg(10*m)},
  ],
  mar:[
    {name:'潮汐',cmd:'EAE',text:'回復 4 士氣',fx:()=>heal(4)},
    {name:'浪潮',cmd:'EWEW',text:'8 傷害',fx:m=>dmg(8*m)},
    {name:'深海之歌',cmd:'ESDSE',text:'回復 6 士氣＋護盾 4',fx:m=>{heal(6);shield(4*m)}},
  ],
  oak:[
    {name:'年輪',cmd:'SWDW',text:'4 傷害，本回合每用一次再 +2',fx:m=>{dmg((4+2*G.oakN)*m);G.oakN++}},
    {name:'根鬚',cmd:'SWS',text:'護盾 4',fx:m=>shield(4*m)},
    {name:'千年樹',cmd:'SWDWDS',text:'14 傷害',fx:m=>dmg(14*m)},
  ],
};
// 時間卡：拉長時間，或縮短時間換傷害
const CARDS={
  ext5:{name:'延長音',time:+5,mult:0,text:'時限 +5 秒'},
  ext10:{name:'延長記號',time:+10,mult:0,text:'時限 +10 秒'},
  fast:{name:'快板',time:-5,mult:.25,text:'時限 -5 秒，傷害 +25%'},
  presto:{name:'急板',time:-10,mult:.6,text:'時限 -10 秒，傷害 +60%'},
  accel:{name:'漸快',time:-3,mult:.15,text:'時限 -3 秒，傷害 +15%'},
};
const START_DECK=['ext5','ext5','ext5','fast','fast','fast','accel','accel','presto','ext10'];
const REWARD_CARDS=['ext5','ext10','fast','presto','accel'];
// 攻擊：[第幾秒, 傷害]；預警 2.5 秒
const every=(dur,step,dmg,from,burst=1)=>{const a=[];for(let t=from;t<dur-0.5;t+=step)for(let b=0;b<burst;b++)a.push([t+b*0.5,dmg]);return a;};
const ENEMIES=[
  {name:'噪音史萊姆',icon:'🦠',hp:90,hint:'教學：每 7 秒撞一下',atk:d=>every(d,7,5,5)},
  {name:'尖嘯蝙蝠群',icon:'🦇',hp:100,hint:'三連擊：一次格擋要蓋住三下',atk:d=>every(d,8,2,5,3)},
  {name:'石像守衛',icon:'🗿',hp:130,hint:'很慢，但每下 12 傷害',atk:d=>every(d,11,12,8)},
  {name:'走音女妖',icon:'👻',hp:170,boss:true,hint:'Boss：攻擊間隔不規則，越後面越快',atk:d=>{const a=[];let t=4;while(t<d-0.5){a.push([t,6]);t+=Math.max(2.5,6-t/10)+Math.random()*2;}return a;}},
];
const BASE_TIME=30,MIN_TIME=12,MAX_TIME=60,WARN=2.5,GUARD_WIN=2;

// ===== 狀態 =====
let G={},AC=null,uid=0;
const mk=id=>({id,uid:++uid});
function newRun(){
  G={deck:START_DECK.map(mk),equip:Object.fromEntries(CHARS.map(c=>[c.id,0])),morale:40,maxMorale:40,fight:0,phase:'map',floats:[],parts:[],history:[]};
  showIntro();
}
const equipped=()=>CHARS.map(c=>({...SKILLS[c.id][G.equip[c.id]],ch:c}));
function startFight(){
  const E=ENEMIES[G.fight];G.enemy={...E,maxHp:E.hp,flash:0,knock:0,shownHp:E.hp};
  G.draw=shuffle(G.deck.slice());G.discard=[];G.hand=[];G.round=0;
  log(`⚔ ${E.name} 出現！${E.hint}`);nextRound();
}
function nextRound(){
  G.round++;G.phase='plan';G.time=BASE_TIME;G.mult=1;G.played=[];G.shield=0;G.buf='';
  for(let i=0;i<5;i++)drawCard();
  render();
}
function drawCard(){if(!G.draw.length){if(!G.discard.length)return;G.draw=shuffle(G.discard);G.discard=[];}G.hand.push(G.draw.pop());}

// ===== 準備階段：打時間卡 =====
function playCard(i){
  if(G.phase!=='plan')return;const c=G.hand[i],C=CARDS[c.id];
  const nt=G.time+C.time;if(nt<MIN_TIME||nt>MAX_TIME){log(`時限只能在 ${MIN_TIME}～${MAX_TIME} 秒之間`);sfx('err');return;}
  G.hand.splice(i,1);G.played.push(c);G.time=nt;G.mult+=C.mult;sfx('card');render();
}
function unplay(i){if(G.phase!=='plan')return;const c=G.played.splice(i,1)[0],C=CARDS[c.id];G.time-=C.time;G.mult-=C.mult;G.hand.push(c);sfx('card');render();}

// ===== 交鋒階段 =====
function audio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended'&&!G.paused)AC.resume();return AC;}
const now=()=>AC.currentTime-G.t0;
function startClash(){
  if(G.phase!=='plan')return;audio();G.phase='clash';G.t0=AC.currentTime+1.2;
  G.attacks=G.enemy.atk(G.time).map(([at,d])=>({at,dmg:d,done:false}));
  G.casts=0;G.last=null;G.streak=0;G.oakN=0;G.lockUntil=0;G.guardUntil=-9;G.guardType=null;
  startMusic(G.t0,G.time);render();requestAnimationFrame(loop);
}
function loop(){
  if(G.phase!=='clash')return;
  if(!G.paused){
    const t=now();
    G.attacks.forEach(a=>{if(!a.done&&t>=a.at){a.done=true;resolveAttack(a,t);}});
    if(G.phase!=='clash')return;
    if(t>=G.time)return timeUp();
  }
  draw();requestAnimationFrame(loop);
}
function typeKey(ch){
  if(G.phase!=='clash'||G.paused)return;const t=now();if(t<0||t<G.lockUntil)return;
  const list=equipped(),str=G.buf+ch;
  keySound(ch);
  if(!list.some(s=>s.cmd.startsWith(str))){ // 按錯：清空並短暫硬直
    G.buf='';G.lockUntil=t+0.35;sfx('err');floatTxt(`按錯了（${str}）`,'#ff4d6d');renderSkills();return;
  }
  G.buf=str;const s=list.find(s=>s.cmd===str);
  if(s){G.buf='';cast(s);}
  renderSkills();
}
function cast(s,replayed){
  G.casts++;
  let m=G.mult;
  if(!replayed&&G.last&&G.last.cmd===s.cmd)m*=0.5;
  phrase(s.ch);sparks(s.ch.col,s.cmd.length*8);if(s.cmd.length>=5)shake(8);
  floatTxt(`${s.ch.icon} ${s.name}${m<G.mult?'（疲勞 ×½）':''}`,s.ch.col,true);
  s.fx(m);
  if(!replayed)G.last=s; // 效果發動後才更新，取樣才拿得到「上一招」
  if(G.enemy.hp<=0&&G.phase==='clash'){G.phase='won';record(now());stopMusic();setTimeout(win,500);}
}
function replay(){if(!G.last||G.last.cmd.startsWith('Q')){floatTxt('沒有可取樣的招','#9a8fb5',true);return;}cast(G.last,true);}
function guard(type){G.guardUntil=now()+GUARD_WIN;G.guardType=type;floatTxt('格擋架勢！','#ffc857',true);}
function resolveAttack(a,t){
  if(t<=G.guardUntil){
    if(G.guardType==='parry'){dmg(a.dmg*2,'彈反');clang();freeze();}
    else{clang();if(G.guardType==='shield')shield(4);}
    floatTxt('擋下！','#7dffa8',true);return;
  }
  let d=a.dmg;const ab=Math.min(G.shield,d);G.shield-=ab;d-=ab;
  G.morale=Math.max(0,G.morale-d);thud(1);shake(10);
  floatTxt(d?`-${d} 士氣`:`護盾吸收 ${ab}`,'#ff4d6d',true);
  if(G.buf){G.buf='';renderSkills();}
  if(G.morale<=0){G.phase='over';stopMusic();setTimeout(lose,500);}
}
function delayNext(sec){const t=now(),a=G.attacks.filter(a=>!a.done&&a.at>t).sort((x,y)=>x.at-y.at)[0];if(!a)return;a.at+=sec;floatTxt(`攻擊延後 ${sec} 秒`,'#c39bff',true);}
// 測試用：每回合拼出幾組
function record(t){
  const secs=Math.max(1,Math.min(G.time,t));G.history.push({casts:G.casts,secs});
  const tot=G.history.reduce((a,h)=>({c:a.c+h.casts,s:a.s+h.secs}),{c:0,s:0});
  log(`📊 本回合 ${secs.toFixed(0)} 秒打出 ${G.casts} 招｜累計平均每 10 秒 ${(tot.c/tot.s*10).toFixed(1)} 招`);
}
function timeUp(){
  G.phase='end';record(now());stopMusic();G.buf='';
  G.discard.push(...G.hand,...G.played);G.hand=[];G.played=[];
  draw();render();setTimeout(nextRound,1000);
}
function dmg(n,why){n=Math.round(n);const E=G.enemy;E.hp=Math.max(0,E.hp-n);E.flash=performance.now();E.knock=Math.min(30,8+n);
  G.floats.push({x:760,y:90,text:`-${n}${why?' '+why:''}`,col:'#fff',born:performance.now(),big:true});
  if(E.hp<=0&&G.phase==='clash'){G.phase='won';record(now());stopMusic();setTimeout(win,500);}}
function shield(n){G.shield+=Math.round(n);floatTxt(`護盾 +${Math.round(n)}`,'#7dffa8',true);}
function heal(n){G.morale=Math.min(G.maxMorale,G.morale+n);floatTxt(`士氣 +${n}`,'#7dffa8',true);}
function win(){
  G.phase='won';G.morale=Math.min(G.maxMorale,G.morale+8);sfx('win');
  if(G.fight===ENEMIES.length-1)return overlay(`<h2>🎶 走音女妖安靜了</h2><p>第一段「歸途旋律」響起。Demo 結束，最後一場打了 ${G.round} 回合。</p><p><b>打完一場，想不想再打一場？</b></p><button class="btn" onclick="closeOv();newRun()">再來一輪</button>`);
  // 獎勵：2 個換招選項（同角色的另一招）＋1 張時間卡
  const swaps=shuffle(CHARS.flatMap(c=>SKILLS[c.id].map((s,i)=>({c,i,s})).filter(x=>x.i!==G.equip[c.id]))).slice(0,2);
  const card=REWARD_CARDS[rint(REWARD_CARDS.length)];
  overlay(`<h2>勝利！${G.enemy.name} 被旋律驅散（${G.round} 回合）</h2><p class="dim">士氣 +8（${G.morale}/${G.maxMorale}）。選一個獎勵：</p>
  <div class="row">${swaps.map(x=>{const cur=SKILLS[x.c.id][G.equip[x.c.id]];return `<div class="card" style="width:240px;border-top:4px solid ${x.c.col}" onclick="takeSwap('${x.c.id}',${x.i})"><div class="t">換招・${x.c.icon} ${x.c.name}</div><b>${x.s.name}</b>${keysHTML(x.s.cmd)}<div style="margin-top:4px">${x.s.text}</div><div class="t" style="margin-top:6px">取代：${cur.name} ${cur.cmd}（${cur.text}）</div></div>`}).join('')}
  ${cardHTML(card,`onclick="takeCard('${card}')"`)}</div><p><button class="btn ghost" onclick="nextFight()">跳過</button></p>`);
}
function takeSwap(c,i){const ch=CHARS.find(x=>x.id===c);log(`🔁 ${ch.name} 改用「${SKILLS[c][i].name}」${SKILLS[c][i].cmd}`);G.equip[c]=i;nextFight();}
function takeCard(id){G.deck.push(mk(id));log(`＋ ${CARDS[id].name} 加入牌組`);nextFight();}
function nextFight(){G.fight++;closeOv();startFight();}
function lose(){G.phase='over';overlay(`<h2>士氣歸零</h2><p>樂團被 ${G.enemy.name} 擊潰了。</p><button class="btn" onclick="closeOv();newRun()">重新開始</button>`);}
function togglePause(){
  if(G.phase!=='clash'){log('只有交鋒階段可以暫停');return;}
  G.paused=!G.paused;G.paused?AC.suspend():AC.resume();
  document.getElementById('pauseBtn').textContent=G.paused?'▶ 繼續（P）':'⏸ 暫停（P）';draw();
}
function restart(){
  if(!confirm('確定要放棄這次冒險，從頭開始？'))return;
  G.phase='over';G.paused=false;stopMusic();if(AC)AC.resume();
  document.getElementById('pauseBtn').textContent='⏸ 暫停（P）';document.getElementById('log').innerHTML='';closeOv();newRun();
}
function showIntro(){
  overlay(`<h2>諧音界・尻招版戰鬥</h2>
  <ul class="dim"><li><b>技能</b>：樂團 7 人，每人一招，共 7 招（下方技能表）。打贏可以把某人的招換成他的另一招。</li>
  <li><b>準備</b>：每回合抽 5 張時間卡，基本時限 ${BASE_TIME} 秒。延長卡拉長時間；快板、急板縮短時間、提高傷害。時間越長，怪物攻擊次數也越多。點已打出的卡可以收回。</li>
  <li><b>交鋒</b>：戰鬥曲的長度＝時限。用鍵盤 W/A/S/D/E/Q 盡量打出技能指令，打完一組就發動。按錯會清空並硬直一下。</li>
  <li><b>防守</b>：怪物攻擊前 ${WARN} 秒會預警（紅色倒數）。打出柯魯格的格擋招，${GUARD_WIN} 秒內的攻擊全擋下。被打中會打斷正在輸入的指令。</li>
  <li><b>疲勞</b>：連續用同一招，傷害減半。不用踩拍。</li></ul>
  <p><button class="btn" onclick="closeOv();startFight()">出發 ▶</button></p>`);
}

// ===== UI =====
const keysHTML=s=>s.split('').map(k=>`<span class="k k${k}">${k}</span>`).join('');
function cardHTML(id,attr=''){const C=CARDS[id],col=C.time>0?'#7dffa8':'#ff7b54';
  return `<div class="card" ${attr} style="border-top:4px solid ${col}"><div class="t">時間卡</div><b>${C.name}</b><div style="font-size:22px;font-weight:900;color:${col}">${C.time>0?'+':''}${C.time} 秒</div><div>${C.mult?`傷害 +${Math.round(C.mult*100)}%`:'&nbsp;'}</div></div>`;}
function render(){renderUI();renderSkills();draw();}
function renderUI(){
  const el=document.getElementById('ui');if(!G.enemy){el.innerHTML='';return;}
  const n=G.phase==='plan'?G.enemy.atk(G.time).length:G.attacks.length;
  const stat=`<div class="panel" style="font-size:18px">時限 <b style="color:var(--gold);font-size:26px">${G.time}</b> 秒　傷害 <b style="color:var(--red);font-size:26px">×${G.mult.toFixed(2)}</b>　<span class="dim" style="font-size:13px">怪物會攻擊約 ${n} 次</span></div>`;
  if(G.phase==='plan'){
    el.innerHTML=`<div class="row" style="align-items:center">${stat}<button class="btn" onclick="startClash()">開始交鋒（Enter）</button><span class="dim">牌庫 ${G.draw.length}｜棄牌 ${G.discard.length}｜牌組 ${G.deck.length}</span></div>
    ${G.played.length?`<div class="dim" style="margin-top:6px">已打出（點一下收回）</div><div class="row">${G.played.map((c,i)=>cardHTML(c.id,`onclick="unplay(${i})"`)).join('')}</div>`:''}
    <div class="dim" style="margin-top:6px">手牌</div><div class="row">${G.hand.map((c,i)=>cardHTML(c.id,`onclick="playCard(${i})"`)).join('')||'<span class="dim">手牌打完了</span>'}</div>`;
  }else el.innerHTML=`<div class="row" style="align-items:center">${stat}<span class="dim">盡量打招！按錯會清空</span></div>`;
}
function renderSkills(){
  const str=G.phase==='clash'?G.buf:'';
  document.getElementById('skills').innerHTML=equipped().map(s=>{
    const live=str&&s.cmd.startsWith(str),tired=G.phase==='clash'&&G.last&&G.last.cmd===s.cmd;
    return `<div class="skill ${live?'live':''} ${tired?'tired':''}" style="border-left:5px solid ${s.ch.col}"><b>${s.ch.icon} ${s.ch.name}・${s.name}</b>${s.guard?' <span style="color:var(--gold)">格擋</span>':''}${tired?' <span style="color:var(--red)">疲勞</span>':''}<div style="margin:4px 0">${s.cmd.split('').map((k,i)=>`<span class="k k${k} ${live&&i<str.length?'done':''}">${k}</span>`).join('')}</div><span class="dim">${s.text}</span></div>`;}).join('');
}

// ===== 繪圖 =====
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
function floatTxt(text,col,big){G.floats.push({x:big?320:60,y:big?150:300,text,col,born:performance.now(),big});}
function sparks(col,n){for(let i=0;i<n;i++)G.parts.push({x:700+Math.random()*120,y:90+Math.random()*60,vx:(Math.random()-.5)*7,vy:(Math.random()-.7)*6,col,born:performance.now()});}
function shake(px){cv.style.transform=`translate(${(Math.random()-.5)*px}px,${(Math.random()-.5)*px}px)`;setTimeout(()=>cv.style.transform='',90);}
function freeze(){G.freezeAt=performance.now();}
function draw(){
  const W=cv.width,H=cv.height,P=performance.now();cx.clearRect(0,0,W,H);if(!G.enemy)return;
  CHARS.forEach((c,i)=>{cx.font='30px system-ui';cx.fillText(c.icon,40+(i%4)*70,95+Math.floor(i/4)*58);cx.font='11px system-ui';cx.fillStyle=c.col;cx.fillText(c.name,40+(i%4)*70,113+Math.floor(i/4)*58);});
  cx.fillStyle='#fff';cx.font='bold 14px system-ui';cx.fillText(`士氣 ${G.morale}/${G.maxMorale}`,40,28);bar(40,36,240,10,G.morale/G.maxMorale,'#7dffa8');
  if(G.shield){cx.fillStyle='#7dffa8';cx.fillText(`🛡 ${G.shield}`,290,46);}
  cx.fillStyle='#9a8fb5';cx.font='13px system-ui';cx.fillText(`第 ${G.fight+1}/${ENEMIES.length} 場・回合 ${G.round}`,40,62);
  const E=G.enemy;E.shownHp+=(E.hp-E.shownHp)*.15;E.knock*=.88;
  cx.save();cx.font='88px system-ui';if(P-E.flash<120)cx.filter='brightness(4)';cx.fillText(E.icon,720+E.knock,150);cx.restore();
  cx.fillStyle='#fff';cx.font='bold 15px system-ui';cx.fillText(`${E.name}${E.boss?'（Boss）':''}`,640,28);
  bar(640,36+(Math.abs(E.shownHp-E.hp)>.5?Math.sin(P/30)*2:0),260,12,E.shownHp/E.maxHp,'#ff4d6d');cx.fillStyle='#fff';cx.font='12px system-ui';cx.fillText(`${E.hp}/${E.maxHp}`,905,47);
  // 時間軸：攻擊點、預警、格擋
  const TY=200,TX=40,TW=880;
  const t=G.phase==='clash'?now():G.phase==='plan'?-1:G.time;
  cx.fillStyle='#17111f';cx.fillRect(TX,TY,TW,26);
  if(G.phase==='clash'){
    cx.fillStyle='#ffc85744';cx.fillRect(TX,TY,TW*Math.max(0,Math.min(1,t/G.time)),26);
    if(t<G.guardUntil){const x0=TX+TW*Math.max(0,t)/G.time,x1=TX+TW*Math.min(G.time,G.guardUntil)/G.time;cx.fillStyle='#7dffa866';cx.fillRect(x0,TY,x1-x0,26);}
    G.attacks.forEach(a=>{if(a.done)return;const x=TX+TW*a.at/G.time;cx.fillStyle='#ff4d6d';cx.fillRect(x-2,TY-4,4,34);});
    const next=G.attacks.filter(a=>!a.done).sort((x,y)=>x.at-y.at)[0];
    if(next&&next.at-t<WARN&&next.at>=t){const r=next.at-t;cx.fillStyle=`rgba(255,77,109,${0.5+0.5*Math.sin(P/60)})`;cx.font='bold 26px system-ui';cx.fillText(`⚠ ${r.toFixed(1)} 秒後攻擊 ${next.dmg}！`,320,190);}
    cx.fillStyle=G.time-t<5?'#ff4d6d':'#ffc857';cx.font='bold 16px system-ui';cx.fillText(t<0?'準備…':`♪ ${Math.max(0,G.time-t).toFixed(1)}`,TX+TW+4,TY+19);
    if(G.buf){cx.font='bold 34px system-ui';cx.fillStyle='#fff';cx.fillText('▶',TX,TY+80);G.buf.split('').forEach((c,i)=>{cx.fillStyle=LCOL[c];cx.fillText(c,TX+40+i*34,TY+80);});}
    if(t<G.lockUntil){cx.fillStyle='#ff4d6d';cx.font='bold 18px system-ui';cx.fillText('硬直中…',TX+300,TY+76);}
  }else if(G.phase==='plan'){cx.fillStyle='#9a8fb5';cx.font='13px system-ui';cx.fillText(`時間軸：${G.time} 秒。開始後紅線是怪物攻擊時間點。`,TX+8,TY+18);}
  G.parts=G.parts.filter(p=>P-p.born<600);G.parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.2;cx.globalAlpha=1-(P-p.born)/600;cx.fillStyle=p.col;cx.fillRect(p.x,p.y,4,4);});cx.globalAlpha=1;
  G.floats=G.floats.filter(f=>P-f.born<1000);G.floats.forEach(f=>{const a=(P-f.born)/1000;cx.globalAlpha=1-a;cx.fillStyle=f.col;cx.font=`bold ${f.big?22:14}px system-ui`;cx.fillText(f.text,f.x,f.y-a*24);});cx.globalAlpha=1;
  if(G.freezeAt&&P-G.freezeAt<150){cx.fillStyle='rgba(255,255,255,.15)';cx.fillRect(0,0,W,H);}
  if(G.paused){cx.fillStyle='rgba(10,6,16,.8)';cx.fillRect(0,0,W,H);cx.fillStyle='#fff';cx.font='bold 36px system-ui';cx.textAlign='center';cx.fillText('已暫停',W/2,H/2);cx.textAlign='left';}
}
function bar(x,y,w,h,f,col){cx.fillStyle='#000';cx.fillRect(x,y,w,h);cx.fillStyle=col;cx.fillRect(x,y,w*Math.max(0,Math.min(1,f)),h);}
function idle(){if(G.phase!=='clash')draw();requestAnimationFrame(idle);}

// ===== 聲音 =====
function osc(type,f,t,d,v,f2){const a=audio(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}
// 戰鬥曲：長度對齊時限，音樂結束＝時間到
let MUS=null,NOISE=null;
function note(dest,type,f,t,d,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(type==='sine'&&f<120)o.frequency.exponentialRampToValueAtTime(40,t+d);o.connect(g);g.connect(dest);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.start(t);o.stop(t+d);}
function noise(dest,t,d,v,hp){if(!NOISE){NOISE=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);const c=NOISE.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);g.connect(dest);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);s.start(t);s.stop(t+d);}
function startMusic(t0,dur){
  stopMusic();const m=AC.createGain();m.gain.value=0.3;m.connect(AC.destination);MUS=m;
  const bars=Math.max(4,Math.round(dur/2)),BL=dur/bars,B=BL/4;
  const prog=[[220,261.6,329.6],[174.6,220,261.6],[261.6,329.6,392],[196,246.9,293.7]],lead=[0,2,1,2,0,2,1,2];
  for(let bar=0;bar<bars;bar++){
    const t=t0+bar*BL,ch=prog[bar%4],hot=bar>=bars*0.66,final=bar>=bars-3;
    for(let b=0;b<4;b++){const tb=t+b*B;
      if(b%2===0)note(m,'sine',110,tb,0.25,0.9);else noise(m,tb,0.15,0.35,1500);
      for(let e=0;e<(hot?4:2);e++)noise(m,tb+e*B/(hot?4:2),0.04,0.12,7000);
      for(let e=0;e<2;e++)note(m,'sawtooth',ch[0]/2,tb+e*B/2,0.22,0.18);}
    note(m,'triangle',ch[1],t,BL,0.06);note(m,'triangle',ch[2],t,BL,0.06);
    if(bar>=2)for(let e=0;e<8;e++)note(m,'square',ch[lead[e]]*(final?4:2),t+e*B/2,0.18,0.04);
  }
  noise(m,t0+dur,1.5,0.5,3000);note(m,'sine',55,t0+dur,1.5,0.9);
}
function stopMusic(){if(!MUS)return;const m=MUS;MUS=null;try{m.gain.setTargetAtTime(0,AC.currentTime,0.08);setTimeout(()=>m.disconnect(),600);}catch(e){}}
const KF={W:659,A:523,S:220,D:784,E:587,Q:988};
function keySound(k){const t=audio().currentTime;osc('triangle',KF[k],t,0.1,0.1);}
function phrase(c){const t=audio().currentTime,base={me:392,grun:196,lis:523,kol:131,pip:440,mar:349,oak:262}[c.id];[0,4,7,12].forEach((st,i)=>osc(c.id==='grun'?'sawtooth':'triangle',base*Math.pow(2,st/12),t+0.02+i*0.06,0.22,0.1));}
function boom(){const t=audio().currentTime;osc('sine',90,t,0.6,0.9,30);osc('sawtooth',60,t,0.4,0.3,25);}
function clang(){const t=audio().currentTime;osc('square',1400,t,0.25,0.15,900);osc('triangle',2100,t,0.3,0.12);}
function thud(v){const t=audio().currentTime;osc('sine',120,t,0.25,0.5*v,40);}
function sfx(n){const t=audio().currentTime;if(n==='card')osc('triangle',880,t,0.06,0.08,1200);if(n==='err')osc('sawtooth',140,t,0.12,0.1,90);if(n==='win')[0,4,7,12].forEach((s,i)=>osc('triangle',523*Math.pow(2,s/12),t+i*0.1,0.4,0.15));}

// ===== 雜項 =====
function rint(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rint(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function log(s){const el=document.getElementById('log');el.innerHTML=`<div>${s}</div>`+el.innerHTML;}
function overlay(h){document.getElementById('ov').innerHTML=`<div class="overlay"><div class="box">${h}</div></div>`;}
function closeOv(){document.getElementById('ov').innerHTML='';}
document.addEventListener('keydown',e=>{
  if(e.repeat||document.getElementById('ov').innerHTML)return;const k=e.key.toUpperCase();
  if(k==='P'){togglePause();return;}
  if(LET.includes(k)){typeKey(k);e.preventDefault();}
  else if(e.key==='Enter'&&G.phase==='plan')startClash();
});
newRun();idle();
</script>
